<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
  </head>
  <body>
    <a-scene>

         </a-assets>
         <img id = "Newsky" src="Newsky.jpg"> 
         <img id = "texture3" src="texture3.jpg">
         <img id = "sandtext" src="sandtext.jpeg">
          </a-assets>

      <a-plane position="0 -0.01 -4"
           rotation="-90 0 0"
           width="8" height="8"
           color="#E8D5A5">
      </a-plane>
      <a-box position="-1 0.2 -3"
         width="0.8" height="0.4" depth="0.6"
         src="#sandtext">
      </a-box>

      <a-box position="-1 0.5 -3"
         width="0.5" height="0.2" depth="0.4"
         src="#sandtext">
      </a-box>

      <a-cylinder position="-1.35 0.32 -3"
              radius="0.14" height="0.64"
              color="#C9A66B">
       </a-cylinder>

      <a-cylinder position="-0.65 0.32 -3"
              radius="0.14" height="0.64"
              color="#C9A66B">
      </a-cylinder>

      <a-cone position="-1.35 0.74 -3"
          radius-bottom="0.17"
          radius-top="0"
          height="0.2"
          src="#sandtext">
      </a-cone>

      <a-cone position="-0.65 0.74 -3"
          radius-bottom="0.17"
          radius-top="0"
          height="0.2"
          src="#sandtext">
      </a-cone>
      
       // ice cream cone
      <a-cone position="1 0.28 -3"
          radius-bottom="0"
          radius-top="0.18"
          height="0.56"
          src="#texture3">
      </a-cone>

      <a-sphere position="1 0.73 -3"
            radius="0.22"
            color="#FFB6C1">
      </a-sphere>

      <a-sphere position="1 0.96 -3"
            radius="0.05"
            color="#D62828">
      </a-sphere>
  
      <a-sky src="Newsky.jpg"></a-sky>
    </a-scene>
  </body>
</html>
