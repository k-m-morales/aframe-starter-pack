<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script>
  
AFRAME.registerComponent('book-hover', {
  schema: {
    title: {type: 'string', default: ''},
    summary: {type: 'string', default: ''}
  },

  init: function () {
    const panel = document.querySelector('#bookSummary');
    const titleText = document.querySelector('#bookTitle');
    const summaryText = document.querySelector('#summaryText');

    this.el.addEventListener('mouseenter', () => {
      titleText.setAttribute('value', this.data.title);
      summaryText.setAttribute('value', this.data.summary);
      panel.setAttribute('visible', true);
    });

    this.el.addEventListener('mouseleave', () => {
      panel.setAttribute('visible', false);
    });
  }
});

</script>


  </head>
  <body>
    <a-scene>
      <a-assets>
        <img id="mountains" src="assets/mountains.jpg">
      <a-asset-item
          id="direwolf"
          src="assets/direwolf.obj">
      </a-asset-item>

      <a-asset-item
          id="dragon"
          src="assets/dragon.obj">
      </a-asset-item>

      <img id="book1" src="assets/book1.jpeg">
      <img id="book2" src="assets/book2.jpeg">
      <img id="book3" src="assets/book3.jpg">
      <img id="book4" src="assets/book4.jpeg">
      <img id="book5" src="assets/book5.jpg">
      </a-assets>




      <a-sky src="#mountains"></a-sky>

      <a-obj-model
        src="#dragon"
        position="-2 1 -6"
        rotation="0 0 0"
        scale="1 1 1"
        material="color: red">
      </a-obj-model>

      <a-obj-model
        src="#direwolf"
        position="8 0.5 4"
        rotation="0 0 0"
        scale="0.03 0.03 0.03"
        material="color: gray">
      </a-obj-model>






      <a-entity position="5.5 0.9 1.5">
        <a-box width="1.2" height="1.8" depth="0.2" color="#4a2922"></a-box>
         <a-plane
        class="clickable"
        src="#book1"
        width="1.2"
        height="1.8"
        position="0 0 0.11"
        book-hover="title: A Game of Thrones;
        summary: In a land where summers can last decades and winters a lifetime, trouble is brewing. The cold is returning, and in the frozen wastes to the North of Winterfell, sinister and supernatural forces are massing beyond the kingdom's protective Wall. 
        At the center of the conflict lie the Starks of Winterfell, a family as harsh and unyielding as the land they were born to. Sweeping from a land of brutal cold to a distant summertime kingdom of epicurean plenty, here is a tale of lords and ladies, soldiers and sorcerers, 
        assassins and bastards, who come together in a time of grim omens. Amid plots and counterplots, tragedy and betrayal, victory and terror, the fate of the Starks, their allies, and their enemies hangs perilously in the balance, as each endeavors to win that deadliest of conflicts: 
        the game of thrones.">
      </a-plane>
      </a-entity>

      <a-entity position="4 0.9 0">
        <a-box width="1.2" height="1.8" depth="0.2"
         color="#4a2922"></a-box>
          <a-plane
        class="clickable"
        src="#book2"
        width="1.2"
        height="1.8"
        position="0 0 0.11"
        book-hover="title: A Clash of Kings;
        summary:A comet the color of blood and flame cuts across the sky. And from the ancient citadel of Dragonstone to the forbidding shores of Winterfell, chaos reigns. Six factions struggle for control of a divided land and the Iron Throne of the Seven Kingdoms, preparing to stake their claims through tempest, turmoil, and war. It is a tale in which brother plots against brother and the dead rise to walk in the night. Here a princess masquerades as an orphan boy; a knight of the mind prepares a poison for a treacherous sorceress; and wild men descend from the Mountains of the Moon to ravage the countryside. Against a backdrop of incest and fratricide, alchemy and murder, victory may go to the men and women possessed of the coldest steel . . . and the coldest hearts. For when kings clash, the whole land trembles.">
      </a-plane>
      </a-entity>

      <a-entity position="2.5 0.9 -1.5">
        <a-box width="1.2" height="1.8" depth="0.2"
         color="#4a2922"></a-box>
        <a-plane
        class="clickable"
        src="#book3"
        width="1.2"
        height="1.8"
        position="0 0 0.11"
        book-hover="title: A Storm of Swords;
        summary:Of the five contenders for power, one is dead, another in disfavor, and still the wars rage as violently as ever, as alliances are made and broken. Joffrey, of House Lannister, sits on the Iron Throne, the uneasy ruler of the land of the Seven Kingdoms. His most bitter rival, Lord Stannis, stands defeated and disgraced, the victim of the jealous sorceress who holds him in her evil thrall. But young Robb, of House Stark, still rules the North from the fortress of Riverrun. Meanwhile, making her way across a blood-drenched continent is the exiled queen, Daenerys, mistress of the only three dragons still left in the world....

                                But as opposing forces maneuver for the final titanic showdown, an army of barbaric wildlings arrives from the outermost line of civilization. In their vanguard is a horde of mythical Others--a supernatural army of the living dead whose animated corpses are unstoppable. As the future of the land hangs in the balance, no one will rest until the Seven Kingdoms have exploded in a veritable storm of swords. . .">

      </a-plane>
      </a-entity>

      <a-entity position="1 0.9 -3">
        <a-box width="1.2" height="1.8" depth="0.2"
         color="#4a2922"></a-box>
        <a-plane
        class="clickable"
        src="#book4"
        width="1.2"
        height="1.8"
        position="0 0 0.11"
        book-hover="title: A Feast for Crows;
        summary:After centuries of bitter strife, the seven powers dividing the land have beaten one another into an uneasy truce. But it's not long before the survivors, outlaws, renegades, and carrion eaters of the Seven Kingdoms gather. Now, as the human crows assemble over a banquet of ashes, daring new plots and dangerous new alliances are formed while surprising faces--some familiar, others only just appearing--emerge from an ominous twilight of past struggles and chaos to take up the challenges of the terrible times ahead. Nobles and commoners, soldiers and sorcerers, assassins and sages, are coming together to stake their fortunes . . . and their lives. For at a feast for crows, many are the guests--but only a few are the survivors.">
      </a-plane>
      </a-entity>

      <a-entity position="-0.5 0.9 -4.5">
        <a-box width="1.2" height="1.8" depth="0.2"
         color="#4a2922"></a-box>
        <a-plane
        class="clickable"
        src="#book5"
        width="1.2"
        height="1.8"
        position="0 0 0.11"
        book-hover="title: A Dance with Dragons;
        summary: In the aftermath of a colossal battle, Daenerys Targaryen rules with her three dragons as queen of a city built on dust and death. But Daenerys has thousands of enemies, and many have set out to find her. Fleeing from Westeros with a price on his head, Tyrion Lannister, too, is making his way east-with new allies who may not be the ragtag band they seem. And in the frozen north, Jon Snow confronts creatures from beyond the Wall of ice and stone, and powerful foes from within the Night's Watch. In a time of rising restlessness, the tides of destiny and politics lead a grand cast of outlaws and priests, soldiers and skin-changers, nobles and slaves, to the greatest dance of all."></a-plane>
      </a-plane>
      </a-entity>

 <a-entity position="2.5 2 13">
      <a-camera
        look-controls="enabled: true"
        wasd-controls="enabled: true">

    
        <a-entity
          cursor="rayOrigin: mouse"
          raycaster="objects: .clickable; far: 100">
        </a-entity>

   
        <a-entity
          id="bookSummary"
          position="0 -0.6 -2"
          visible="false">

          <a-plane
            width="2.8"
            height="1.5"
            color="black"
            opacity="0.95">
          </a-plane>

          <a-text
            id="bookTitle"
            value=""
            align="center"
            anchor="center"
            color="white"
            width="2"
            position="0 0.60 0.02">
          </a-text>

          <a-text
            id="summaryText"
            value=" "
            align="center"
            anchor="center"
            baseline="center"
            color="white"
            width=".9"
            wrap-count="35"
            position="0 -0.12 0.02">
        </a-text>

        </a-entity>

      </a-camera>
    </a-entity>


    </a-scene>
  </body>
</html>
