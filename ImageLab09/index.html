<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
     <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-sphere position="0 0.75 -4" radius="0.75" color="#6c98e0"></a-sphere>
      <a-sphere position="0 1.8 -4" radius="0.55" color="#6c98e0"></a-sphere>
      <a-sphere position="0 2.6 -4" radius="0.4" height="1.5" color="#6c98e0"></a-sphere>
      <a-sphere position="-0.15 2.7 -3.63" radius="0.05" color="black"></a-sphere>
      <a-sphere position="0.15 2.7 -3.63" radius="0.05" color="black"></a-sphere>
      <a-cone position="0 2.55 -3.55" radius-bottom="0.08" radius-top="0" height="0.3" rotation="90 0 0" color="orange"></a-cone>
      <a-sphere position="0 1.8 -3.45" radius="0.06" color="black"></a-sphere>
      <a-sphere position="0 1.55 -3.4" radius="0.06" color="black"></a-sphere>
      <a-cylinder position="-0.75 1.9 -4" radius="0.04" height="0.8"rotation="0 0 45" color="#654321"></a-cylinder>
      <a-cylinder position="0.75 1.9 -4" radius="0.04" height="0.8"rotation="0 0 -45" color="#654321"></a-cylinder>
      
      <!-- <a-sky color="#ECECEC"></a-sky> -->
      <!-- the enviroment entity includes a sky. Choose from the presets"none, default, contact, egypt, checkerboard, forest, goaland, yavapai, goldmine, threetowers, poison, arches, tron, japan, dream, volcano, starry, osiris, moon" -->
      <a-entity environment="preset: moon ; dressingAmount: 500"></a-entity>
    </a-scene>
  </body>
</html>
